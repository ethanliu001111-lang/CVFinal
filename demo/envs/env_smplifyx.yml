# Stretch environment — SMPLify-X optimization path.
# Must be a SEPARATE conda env from env_hrnet_hmr2 because SMPLify-X was tested
# on PyTorch 1.x + Python 3.6/3.7.  Stretch goal cutoff: 5/5 EOD.

name: cv-final-smplifyx
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.8
  - pytorch=1.13.*           # SMPLify-X compatible
  - torchvision=0.14.*
  - cudatoolkit=11.6

  - pip
  - pip:
      - smplx
      - chumpy
      - trimesh
      - numpy<2
      - opencv-python
      - matplotlib
      - imageio
      - pyyaml
      - tqdm
      # SMPLify-X itself: clone separately
      #   git clone https://github.com/vchoutas/smplify-x.git
      # No pip install — run via:  python smplify-x/smplifyx/main.py --config ...
