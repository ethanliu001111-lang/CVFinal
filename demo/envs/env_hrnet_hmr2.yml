# Colab / CUDA Linux environment — main pipeline (HRNet + 4D-Humans).
# Use as: !pip install -r demo/envs/env_hrnet_hmr2.txt
# (this file documents the conda equivalent for Linux desktop reproducers)

name: cv-final-main
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.1.*
  - torchvision=0.16.*
  - pytorch-cuda=11.8

  # Headless rendering on Linux (Colab handles via apt below)
  - libosmesa
  - freeglut

  - pip
  - pip:
      # MMPose stack (HRNet)
      - openmim
      - mmengine>=0.7
      - "mmcv>=2.0,<2.2"
      - mmdet>=3.1
      - mmpose>=1.1

      # 4D-Humans (HMR 2.0) — install from GitHub via:
      #   git clone https://github.com/shubham-goel/4D-Humans.git
      #   cd 4D-Humans && pip install -e '.[all]'

      # SMPL family
      - smplx
      - chumpy   # for legacy SMPL .pkl deserialization

      # Visualization
      - trimesh
      - pyrender
      - imageio
      - matplotlib
      - numpy<3
      - pandas
      - opencv-python
